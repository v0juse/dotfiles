# Windows (psmux) overrides, sourced after stow_files/.tmux.conf by ~/.psmux.conf
set -g default-terminal "xterm-256color"

# Run tmux sessionizer (windows/bin is on the user PATH)
bind-key -r f new-window -- "tmux-sessionizer"

# reload config
bind r source-file ~/.psmux.conf \; display "Reloaded tmux config"
